name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise run install

      - name: Install Playwright browsers
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Verify generated OpenAPI is up to date
        run: |
          mise run api:gen
          git diff --exit-code -- api/openapi/openapi.yaml

      - name: Run checks
        run: mise run check
