name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise run install

      - name: Install Playwright system dependencies
        run: npm --prefix frontend exec playwright install-deps chromium

      - name: Verify generated OpenAPI is up to date
        run: |
          mise run api:gen
          git diff --exit-code -- api/openapi/openapi.yaml

      - name: Run checks
        run: mise run check

  docker-port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t calendar .

      - name: Run container with a non-standard PORT
        run: docker run --rm -d --name calendar -e PORT=3210 -p 3210:3210 calendar

      - name: Verify health on PORT
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3210/api/health; then
              echo "healthy on PORT=3210"
              exit 0
            fi
            sleep 2
          done
          echo "health check on PORT=3210 failed"
          docker logs calendar
          exit 1

      - name: Verify the default port stays closed
        run: |
          if curl -fsS --max-time 2 http://localhost:8080/api/health; then
            echo "application ignored PORT and listened on 8080"
            docker logs calendar
            exit 1
          fi
          echo "8080 is not listening, as expected"
