name: release-please

# По спеке (docs/spec.md): автоматические релизы подключаются на шаге
# реализации после первой функции. До тех пор — только ручной запуск,
# чтобы не падать на каждом push.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package-name: calendar
          manifest-file: CHANGELOG.md
          release-type: simple
          subdir: ./
          draft: false
          bump-out-of-cycle: true