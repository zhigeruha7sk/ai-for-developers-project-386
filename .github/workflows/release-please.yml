name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package-name: calendar
          manifest-file: CHANGELOG.md
          release-type: simple
          subdir: ./
          draft: false
          bump-out-of-cycle: true